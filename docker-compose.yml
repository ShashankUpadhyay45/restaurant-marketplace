version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gourmetfleet-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gourmetfleet
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: gourmetfleet-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gourmetfleet-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/gourmetfleet
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:80
      JWT_SECRET: production_jwt_secret_docker_gourmetfleet
      JWT_REFRESH_SECRET: production_jwt_refresh_docker_gourmetfleet
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gourmetfleet-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:
